<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録フォーム</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-slate-800">ユーザー登録</h1>
        <div id="success-message" class="hidden mb-4 p-4 text-sm text-green-700 bg-green-100 rounded-lg" role="alert">登録完了！</div>

        <form id="signup-form" novalidate class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-1">名前</label>
                <input type="text" id="name" name="name" required
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p id="error-name" class="text-rose-500 text-xs mt-1 hidden"></p>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">メールアドレス</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p id="error-email" class="text-rose-500 text-xs mt-1 hidden"></p>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">パスワード（8文字以上）</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p id="error-password" class="text-rose-500 text-xs mt-1 hidden"></p>
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="terms" name="terms" required
                    class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded">
                <label for="terms" class="ml-2 block text-sm text-slate-900">利用規約に同意する</label>
            </div>
            <p id="error-terms" class="text-rose-500 text-xs mt-1 hidden"></p>

            <button type="submit"
                class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition duration-200">
                送信
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('signup-form');
        const successMessage = document.getElementById('success-message');

        form.addEventListener('submit', function (e) {
            e.preventDefault(); 

            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const termsInput = document.getElementById('terms');

            const errorName = document.getElementById('error-name');
            const errorEmail = document.getElementById('error-email');
            const errorPassword = document.getElementById('error-password');
            const errorTerms = document.getElementById('error-terms');

            [errorName, errorEmail, errorPassword, errorTerms].forEach(el => {
                el.textContent = '';
                el.classList.add('hidden');
            });
            successMessage.classList.add('hidden');

            let isValid = true;

            if (nameInput.value.trim() === '') {
                errorName.textContent = '名前を入力してください。';
                errorName.classList.remove('hidden');
                isValid = false;
            }
            if (emailInput.value.trim() === '') {
                errorEmail.textContent = 'メールアドレスを入力してください。';
                errorEmail.classList.remove('hidden');
                isValid = false;
            } else if (!emailInput.value.includes('@')) {
                errorEmail.textContent = '有効なメールアドレスを入力してください（@を含めてください）。';
                errorEmail.classList.remove('hidden');
                isValid = false;
            }
            if (passwordInput.value === '') {
                errorPassword.textContent = 'パスワードを入力してください。';
                errorPassword.classList.remove('hidden');
                isValid = false;
            } else if (passwordInput.value.length < 8) {
                errorPassword.textContent = 'パスワードは8文字以上で入力してください。';
                errorPassword.classList.remove('hidden');
                isValid = false;
            }

            if (!termsInput.checked) {
                errorTerms.textContent = '利用規約に同意してください。';
                errorTerms.classList.remove('hidden');
                isValid = false;
            }

            if (isValid) {
                successMessage.classList.remove('hidden');
                form.reset(); // フォームをリセットする場合
            }
        });
    </script>
</body>
</html>
