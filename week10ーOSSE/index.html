<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHubユーザー検索</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <main class="mx-auto max-w-md rounded bg-white p-6 shadow">
    <h1 class="mb-4 text-2xl font-bold">GitHubユーザー検索</h1>
    <label for="username" class="block mb-2">ユーザー名</label>
    <input id="username" type="text" class="w-full rounded border p-2">
    <button id="search" class="mt-3 rounded bg-blue-600 px-4 py-2 text-white">検索</button>
    <p id="message" class="mt-4 text-red-600"></p>
    <div id="result" hidden class="mt-4 space-y-2">
      <img id="avatar" alt="アバター画像" class="h-24 w-24 rounded-full">
      <p>名前：<span id="name"></span></p>
      <p>自己紹介：<span id="bio"></span></p>
      <p>フォロワー数：<span id="followers"></span></p>
    </div>
  </main>
  <script>
    const username = document.querySelector('#username');
    const button = document.querySelector('#search');
    const message = document.querySelector('#message');
    const result = document.querySelector('#result');

    button.addEventListener('click', async () => {
      message.textContent = '';
      result.hidden = true;
      button.disabled = true;

      try {
        const response = await fetch('https://api.github.com/users/' + encodeURIComponent(username.value.trim()));
        if (!response.ok) {
          message.textContent = 'ユーザーが見つかりませんでした';
          return;
        }
        const data = await response.json();
        console.log(data);
        document.querySelector('#avatar').src = data.avatar_url;
        document.querySelector('#name').textContent = data.name ?? '';
        document.querySelector('#bio').textContent = data.bio ?? '';
        document.querySelector('#followers').textContent = data.followers;
        result.hidden = false;
      } catch (error) {
        message.textContent = '通信に失敗しました';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
